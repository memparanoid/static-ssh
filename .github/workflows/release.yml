name: release

# Each architecture builds on its own runner. Nothing is emulated: OpenSSH's
# configure decides what the platform supports by running test programs, and
# under qemu-user those answers are wrong.
#
# One runner per architecture builds every version in `versions`, one after
# another on the same docker daemon, so the base image and its packages are
# built once and every version reuses them.
#
# A push to main publishes one release per version, tagged `<version>-<recipe>`,
# where the recipe is the start of the Dockerfile's SHA256: the same recipe
# never publishes twice, and a changed one publishes every version under new
# tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile carries the static gate, the shipped-binaries gate and
      # the run check, so a version that builds here already passed them. A
      # version that fails does not stop the others: the step fails at the end,
      # naming every one that did.
      - name: Build every version
        run: |
          set -u
          mkdir -p dist
          failed=""

          while read -r version sha256; do
            [ -n "$version" ] || continue
            echo "::group::$version"

            asset="openssh-${version}-static-${{ matrix.arch }}.tar.gz"

            if docker build \
                 --build-arg OPENSSH_VERSION="$version" \
                 --build-arg OPENSSH_SHA256="$sha256" \
                 --output type=local,dest="out/$version" . < /dev/null \
               && tar -czf "dist/$asset" -C "out/$version" . \
               && (cd dist && sha256sum "$asset" > "$asset.sha256"); then
              cat "dist/$asset.sha256"
            else
              failed="$failed $version"
            fi

            echo "::endgroup::"
          done < versions

          if [ -n "$failed" ]; then
            echo "failed on ${{ matrix.arch }}:$failed" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openssh-static-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Tags are never moved: consumers pin an asset by its SHA256, and a tag
      # published again would silently change what that pin covers.
      - name: Publish every version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          recipe=$(sha256sum Dockerfile | cut -c1-12)

          while read -r version sha256; do
            [ -n "$version" ] || continue
            tag="${version}-${recipe}"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag is already published; not touched."
              continue
            fi

            mkdir -p "release/$version"
            cp dist/openssh-"${version}"-static-* "release/$version/"
            cat "release/$version"/*.sha256 > "release/$version/SHA256SUMS"

            {
              echo "OpenSSH ${version}, source SHA256 ${sha256}."
              echo
              echo '```'
              cat "release/$version/SHA256SUMS"
              echo '```'
            } > "release/$version/NOTES"

            gh release create "$tag" < /dev/null \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes-file "release/$version/NOTES" \
              "release/$version"/*.tar.gz "release/$version"/*.sha256 \
              "release/$version/SHA256SUMS"
          done < versions
